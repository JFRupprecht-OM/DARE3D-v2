name: Regression preprocessing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permanent-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install build pytest
          python -m pip install -e .
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify the regression release surface in both distributions
        run: >-
          python -c "import glob,tarfile,zipfile;
          s=glob.glob('dist/*.tar.gz')[0]; w=glob.glob('dist/*.whl')[0];
          sn=tarfile.open(s).getnames(); wn=zipfile.ZipFile(w).namelist();
          required=('dare3d/data/components/regression_geometry.py',
          'napari_dare3d/napari.yaml','configs/predict.yaml');
          assert all(any(n.endswith('/'+p) for n in sn) for p in required);
          assert all(any(n.endswith(p) for n in wn) for p in required)"
      - name: Run permanent regression preprocessing tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest
          tests/test_regression_preprocessing.py
          tests/test_regression_entrypoint_configuration.py
          tests/test_inference_checkpoint_loading.py
          tests/test_geometry.py
