name: Scale handling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install build pytest
          python -m pip install -e .
      - name: Run permanent scale-handling tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_scale_handling.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify the scale table is present in both distributions
        run: >-
          python -c "import glob,tarfile,zipfile;
          s=glob.glob('dist/*.tar.gz')[0]; w=glob.glob('dist/*.whl')[0];
          assert any(n.endswith('/data/3D/scales.json') for n in tarfile.open(s).getnames());
          assert any(n.endswith('/data/3D/scales.json') for n in zipfile.ZipFile(w).namelist())"
